<!DOCTYPE html>
<html lang="en">
<head>
<title>time calculator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    body {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 16px;
        background: #212529;
        color: #DEE2E6;
        padding: 32px 116px;
        margin: 0px;
    }

    #calc-input {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-transform: uppercase;
        text-align: right;
        padding: 6px 0.9em;
        font-size: 16px;
        background: #2B3035;
        color: #DEE2E6;
    }

    p#add-time {
        text-align:right;
    }

    .result {
        text-align: right;
    }

    .selectContainer {
        min-width: 135px;
    }

    .selectStart, .selectEnd {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        appearance: none;  /* remove dropdown arrow */
        width: 80px;
        text-align: center;
        margin-left: 8px;
        margin-right: 8px;
        margin-top: 5px;
        margin-bottom: 8px;
        padding: 6px 12px;
        font-size: 16px;
        background: #2B3035;
        color: #DEE2E6;
    }

    option:checked {
        color: #77DD77;
    }

    mark, mark > button.analyze-wind {
        background-color: transparent;
        color: #77DD77;
    }

    #main {
        display: grid;
        grid-template-columns: 1fr;
        container-type: inline-size;
        margin-top: 32px;
        margin-bottom: 32px;
    }

    #left {
        top: 114px;
        height: fit-content;
        width: fit-content;
        margin-bottom: 64px;
        margin-right: 64px;
    }

    #title-and-clock {
        margin-bottom: 64px;
    }

    #clock {
        white-space: nowrap;
        cursor: pointer;
    }

    #title {
        margin-top: 0px;
    }

    @media screen and (width > 1400px) {
        #main {
            grid-template-columns: 1fr 3fr;
        }

        #left {
            position: sticky;
        }
    }

    a {
        color: lightskyblue;
    }

    body {
        min-height: 95vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
    }

    header {
        min-height: 50px;
    }

    footer {
        margin-top: 50px;
        min-height: 50px;
        opacity: 50%;
    }

</style>
</head>
<body>
    <header>
        <a href="../../directory">directory</a>
        |
        <a href="https://github.com/CarltonYeung/CarltonYeung.github.io/blob/master/dispatch/time-calculator/index.html" target="_blank">git</a>
        |
        <a href="../../disclaimer">disclaimer</a>
    </header>
    <div id="main">
        <div id="left">
            <div id="title-and-clock">
                <h1 id="title">time calculator</h1>
                <h2 id="clock" onclick="click_clock()"></h2>
            </div>
            <div id="div-calc">
                <p id="add-time">add</p>
                <textarea id="calc-input" rows="20" cols="40" onkeyup="doSumthin()" placeholder="hhmm
hhmm"></textarea>
                <br>
                <p id="result-hh-mm" class="result"></p>
                <p id="result-dd-hh-mm" class="result"></p>
            </div>
        </div>
    </div>
    <footer>
    </footer>

<script type="text/javascript">

function doSumthin() {
    let inputTextArea = document.querySelector("#calc-input");
    inputTextArea.value = inputTextArea.value.replace(/[^\d\n]/g, "");
    let value = inputTextArea.value;

    if (event.key === "Enter") {
        if (!inputTextArea.value.trim()) {
            inputTextArea.value = "";
            return;
        }

        inputTextArea.value = inputTextArea.value.replace(/\n+/g, "\n");
        inputTextArea.value = inputTextArea.value.trim() + "\n";
        times = value.split(/\s/).filter(t => t);

        let minutes = times.map(hhmm => {
            return hhmm.slice(-2);
        })

        let hours = times.map(hhmm => {
            return hhmm.slice(0, -2);
        })

        let total_minutes = minutes.reduce((acc, cur) => acc + parseInt(cur), 0);
        let total_hours = hours.reduce((acc, cur) => acc + (parseInt(cur) || 0), 0);
        total_minutes += total_hours * 60;
        console.debug(`total_minutes=${total_minutes}`);

        document.querySelector("#result-hh-mm").innerHTML = `${Math.floor(total_minutes / 60)} h ${(total_minutes % 60).toString().padStart(2, "0")} m`;
        document.querySelector("#result-dd-hh-mm").innerHTML = `${Math.floor(total_minutes / 60 / 24)} d ${(Math.floor(total_minutes / 60) % 24).toString().padStart(2, "0")} h ${(total_minutes % 60).toString().padStart(2, "0")} m`;
    }
    else {
        document.querySelector("#result-hh-mm").innerHTML = "";
        document.querySelector("#result-dd-hh-mm").innerHTML = "";
    }
}

function click_clock() {
    const re = /\s(\d+):(\d+):\d+\s/;
    let time = document.querySelector("#clock").innerHTML.match(re);
    let input = document.querySelector("#calc-input");
    input.setRangeText(`${time[1]}${time[2]}\n`, input.selectionStart, input.selectionEnd, "end");
    input.focus();
    doSumthin();
}

function displayClock() {
    let now = new Date().toUTCString();
    document.querySelector("#clock").innerHTML = now;

    const REFRESH_INTERVAL = 1000;
    mytime = setTimeout("displayClock()", REFRESH_INTERVAL)
}

displayClock();

</script>
</body>
</html>
